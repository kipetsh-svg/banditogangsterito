name: ChatGPT Check Bundle

on:
  push:
    branches:
      - '**-chatgpt-check'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-check-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Prepare ChatGPT terminal bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Create source and dependencies archive
        run: |
          tar -czf "$RUNNER_TEMP/bandito-chatgpt-check.tar.gz" \
            --exclude='./.git' \
            --exclude='./.tmp' \
            --exclude='./build' \
            .

      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bandito-chatgpt-check
          path: ${{ runner.temp }}/bandito-chatgpt-check.tar.gz
          if-no-files-found: error
          retention-days: 1